services:
  nginx:
    build:
      context: ./requirements/nginx
    image: nginx:local
    container_name: nginx
    restart: always
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN_NAME}
    volumes:
      - wordpress_data:/var/www/html:ro
      - /home/${LOGIN}/data/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://127.0.0.1 -I || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - inception
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb:local
    container_name: mariadb
    restart: always
    environment:
      - MARIADB_DATABASE=${MYSQL_DATABASE}
      - MARIADB_USER=${MYSQL_USER}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin --protocol=socket --socket=/run/mysqld/mysqld.sock -uroot -p$$(tr -d '\\r\\n' </run/secrets/db_root_password) ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - inception

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress-fpm:local
    container_name: wordpress
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - MARIADB_DATABASE=${MYSQL_DATABASE}
      - MARIADB_USER=${MYSQL_USER}
      - WP_URL=https://${DOMAIN_NAME}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
      - WP_USER_PASSWORD=${WP_USER_PWD}
    secrets:
      - db_password
      - wp_admin_password
    volumes:
      - wordpress_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - inception

volumes:
  wordpress_data:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress
  mariadb_data:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

networks:
  inception:
    driver: bridge
