user  www-data;
worker_processes  auto;

events { worker_connections  1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

	error_log /dev/stderr warn;
	log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    
	server {
        listen 443 ssl;
        server_name ${DOMAIN};

        ssl_protocols TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384';
        ssl_prefer_server_ciphers on;
        ssl_certificate     /etc/nginx/certs/${DOMAIN}.crt;
        ssl_certificate_key /etc/nginx/certs/${DOMAIN}.key;

        root /var/www/html;
        index index.php index.html;

        location /status { 
			return 200 'ok'; 
			add_header Content-Type text/plain; 
		}

    	location ~ [^/]\.php(/|$) { 
            try_files $uri =404;
            fastcgi_pass wordpress:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param HTTPS on;
			fastcgi_param HTTP_X_FORWARDED_PROTO https;
			fastcgi_param HTTP_HOST $host;
			fastcgi_param SERVER_NAME $host;
        }
    }

	server {
 		listen 443 ssl;
		server_name dozzle.${DOMAIN};

    	ssl_protocols TLSv1.3;
    	ssl_certificate     /etc/nginx/certs/dozzle.${DOMAIN}.crt;
    	ssl_certificate_key /etc/nginx/certs/dozzle.${DOMAIN}.key;

    	location / {
    	    proxy_pass http://dozzle:8080;
    	    proxy_http_version 1.1;
    	    proxy_set_header Host $host;
    	    proxy_set_header X-Real-IP $remote_addr;
    	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	    proxy_set_header X-Forwarded-Proto https;
    	    proxy_set_header Upgrade $http_upgrade;
    	    proxy_set_header Connection "upgrade";
    	}
	}

	server {
		listen 443 ssl;
		server_name llebugle.42.me;

		ssl_protocols TLSv1.3;
		ssl_certificate     /etc/nginx/certs/llebugle.42.me.crt;
		ssl_certificate_key /etc/nginx/certs/llebugle.42.me.key;

		location / {
			proxy_pass http://portfolio:8080;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
		}
	}
}

